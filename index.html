<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Palisade Field Services</title>
<meta name="description" content="Institutional property preservation, inspections, REO and field services across all 159 Georgia counties.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --navy-950:#060E1A;--navy:#0B1B2E;--navy-800:#10243C;--navy-700:#18314F;
  --slate:#3D5268;--bluegray:#8A9BB0;--mist:#EEF2F6;--mist-2:#E4EAF1;--line:#D6DEE8;
  --charcoal:#1C2127;--ink-2:#46505C;--white:#FFFFFF;--paper:#F7F9FB;
  --accent:#F26B21;--accent-hover:#D9561028;--accent-ink:#B8490D;--accent-soft:#FDEBDF;
  --ok:#23A26D;--ok-soft:#DDF3E9;--warn:#D99A0B;--warn-soft:#FBF0D3;--info:#3A7BD5;
  --tier-core:#F26B21;--tier-std:#F4A259;--tier-ext:#6F87A3;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-s:4px;--r-m:8px;--r-l:14px;
  --shadow-1:0 1px 2px rgba(6,14,26,.06),0 2px 8px rgba(6,14,26,.06);
  --shadow-2:0 10px 30px -8px rgba(6,14,26,.22),0 2px 6px rgba(6,14,26,.08);
  --wrap:1200px;--gutter:clamp(16px,4vw,40px);
  --hdr:72px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--charcoal);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
a{color:inherit}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:88%;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em;word-spacing:.08em}
h1{font-size:clamp(2.3rem,5.4vw,4.1rem);font-weight:800}
h2{font-size:clamp(1.8rem,3.4vw,2.7rem);font-weight:750}
h3{font-size:1.28rem;font-weight:700}
h4{font-size:1.05rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gutter)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);display:inline-flex;align-items:center;gap:.6em;font-weight:500}
.eyebrow::before{content:"";width:18px;height:2px;background:currentColor}
.on-dark .eyebrow{color:#FF9A5C}
.lede{font-size:1.14rem;color:var(--ink-2);max-width:62ch}
.on-dark .lede{color:#B7C4D3}
.muted{color:var(--ink-2)}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-tight{padding-block:clamp(40px,5vw,64px)}
.sec-head{display:grid;gap:14px;margin-bottom:clamp(28px,4vw,48px);max-width:760px}
.sec-head.split{max-width:none;grid-template-columns:1fr auto;align-items:end;gap:24px}
@media (max-width:760px){.sec-head.split{grid-template-columns:1fr}}
.on-dark{background:var(--navy);color:#E9EEF4}
.on-mist{background:var(--mist)}
.on-white{background:var(--white)}

/* buttons */
.btn{--bg:var(--accent);--fg:#fff;display:inline-flex;align-items:center;justify-content:center;gap:.55em;padding:.82em 1.35em;border-radius:var(--r-s);background:var(--bg);color:var(--fg);font-weight:600;font-size:.95rem;border:1.5px solid transparent;text-decoration:none;cursor:pointer;transition:transform .18s ease,background .18s ease,box-shadow .18s ease,border-color .18s;white-space:nowrap;line-height:1.2}
.btn:hover{background:#DE5A12;transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(242,107,33,.7)}
.btn:active{transform:translateY(0)}
.btn svg{width:1.05em;height:1.05em;flex:none;transition:transform .18s}
.btn:hover svg.arr{transform:translateX(3px)}
.btn.ghost{--bg:transparent;--fg:var(--navy);border-color:var(--navy)}
.btn.ghost:hover{background:var(--navy);color:#fff;box-shadow:none}
.on-dark .btn.ghost,.btn.ghost.light{--fg:#fff;border-color:rgba(255,255,255,.5)}
.on-dark .btn.ghost:hover,.btn.ghost.light:hover{background:#fff;color:var(--navy)}
.btn.navy{--bg:var(--navy)}.btn.navy:hover{background:var(--navy-700);box-shadow:none}
.btn.sm{padding:.55em .95em;font-size:.86rem}
.btn.lg{padding:1em 1.6em;font-size:1rem}
.btn[disabled]{opacity:.55;pointer-events:none}
.link{color:var(--accent-ink);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:.35em;background:none;border:0;padding:0;cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.on-dark .link{color:#FF9A5C}

/* preview banner */
.preview{background:#FFF6DA;color:#5B4300;font-size:.8rem;border-bottom:1px solid #EFD98C}
.preview .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:6px}
.preview button{background:none;border:0;cursor:pointer;color:inherit;font-size:1.1rem;line-height:1;padding:4px}

/* utility bar + header */
.util{background:var(--navy-950);color:#AFBDCC;font-size:.8rem}
.util .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:7px;align-items:center;flex-wrap:wrap}
.util a{text-decoration:none;color:#DCE4EC}.util a:hover{color:#fff}
.util .l,.util .r{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.util .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px rgba(35,162,109,.25);margin-right:6px}
.util .join{color:#FF9A5C!important;font-weight:600}
@media (max-width:760px){.util .hide-s{display:none}}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .2s}
header.site.scrolled{box-shadow:0 6px 20px -12px rgba(6,14,26,.35)}
header.site .wrap{max-width:1400px;display:flex;align-items:center;gap:20px;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);flex:none}
.brand svg{width:36px;height:36px}
.brand b{font-family:var(--f-display);font-stretch:80%;font-size:1.28rem;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.2em;color:var(--slate);text-transform:uppercase;margin-top:3px}
nav.main{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.main > a,nav.main .dd > button{white-space:nowrap;font-size:.9rem;font-weight:500;padding:9px 11px;border-radius:var(--r-s);text-decoration:none;color:var(--charcoal);background:none;border:0;cursor:pointer;display:inline-flex;gap:4px;align-items:center;position:relative}
nav.main > a:hover,nav.main .dd > button:hover{background:var(--mist)}
nav.main a.active,nav.main .dd.active > button{color:var(--accent-ink)}
nav.main a.active::after,nav.main .dd.active > button::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:2px;background:var(--accent)}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 8px);left:-12px;width:560px;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-2);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:2px;opacity:0;visibility:hidden;transform:translateY(6px);transition:.18s}
.dd:hover .dd-menu,.dd:focus-within .dd-menu,.dd.open .dd-menu{opacity:1;visibility:visible;transform:none}
.dd-menu a{display:flex;gap:12px;padding:10px;border-radius:var(--r-s);text-decoration:none;align-items:flex-start}
.dd-menu a:hover{background:var(--mist)}
.dd-menu a .ic{width:34px;height:34px;flex:none;border-radius:6px;background:var(--navy);color:#fff;display:grid;place-items:center}
.dd-menu a .ic svg{width:18px;height:18px}
.dd-menu a b{display:block;font-size:.9rem}
.dd-menu a span{display:block;font-size:.78rem;color:var(--ink-2);line-height:1.35}
.dd-menu .all{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;padding:10px;font-weight:600;font-size:.86rem;color:var(--accent-ink)}
.hdr-cta{display:flex;gap:8px;align-items:center}
.portal-btn{font-size:.82rem;font-weight:600;padding:.5em .8em;border-radius:var(--r-s);text-decoration:none;color:var(--navy);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center;background:#fff;transition:.15s}
.portal-btn:hover{border-color:var(--navy);background:var(--mist)}
.portal-btn svg{width:14px;height:14px}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r-s);width:44px;height:44px;cursor:pointer;place-items:center}
.burger svg{width:22px;height:22px}
@media (max-width:1440px){nav.main > a,nav.main .dd > button{padding:9px 7px;font-size:.85rem}header.site .brand small{display:none}header.site .wrap{gap:14px}.hdr-cta .portal-btn svg{display:none}.hdr-cta .portal-btn{font-size:.78rem;padding:.5em .6em}.hdr-cta .btn.sm{font-size:.82rem;padding:.55em .8em}}
@media (max-width:1200px){nav.main,.hdr-cta .portal-btn{display:none}.burger{display:grid}.hdr-cta{margin-left:0}}
@media (max-width:480px){.hdr-cta .btn{display:none}}
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(6,14,26,.55);animation:fade .2s}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(400px,92vw);background:#fff;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;animation:slidein .25s ease}
.drawer .panel > a,.drawer summary{padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;font-size:1.02rem;display:flex;justify-content:space-between;cursor:pointer;list-style:none}
.drawer details a{display:block;padding:10px 12px;text-decoration:none;font-size:.95rem;color:var(--ink-2);border-bottom:1px dashed var(--line)}
.drawer .d-cta{display:grid;gap:10px;margin-top:16px}
.drawer .close{align-self:flex-end;background:none;border:0;font-size:1.8rem;cursor:pointer;line-height:1;padding:4px 8px}
@keyframes fade{from{opacity:0}}
@keyframes slidein{from{transform:translateX(30px);opacity:.4}}

/* page transitions */
#app{min-height:60vh}
.page{animation:pagein .45s cubic-bezier(.2,.7,.2,1)}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}}
.pending{opacity:0;transform:translateY(22px)}
.revealed{opacity:1;transform:none;transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% 10%,#16345A 0%,transparent 60%),linear-gradient(180deg,var(--navy) 0%,var(--navy-950) 100%);color:#fff}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,transparent,#000 40%,#000);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(48px,6vw,88px) clamp(40px,5vw,72px)}
.hero h1{color:#fff;margin-block:18px 20px}
.hero h1 .acc{color:#FF8A45}
.hero h1 span{display:block}
.hero .lede{color:#BFCCDA}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero .meta{display:flex;gap:22px;margin-top:34px;flex-wrap:wrap;font-size:.84rem;color:#9FB0C3}
.hero .meta b{color:#fff;font-family:var(--f-display);font-size:1.5rem;font-stretch:85%;display:block;line-height:1}
@media (max-width:960px){.hero .wrap{grid-template-columns:1fr}}
.opsboard{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:var(--r-l);padding:16px;backdrop-filter:blur(4px)}
.opsboard .ob-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:.72rem;color:#9FB0C3;letter-spacing:.06em;text-transform:uppercase;gap:8px;flex-wrap:wrap}
.opsboard .live{color:#6BE0A8;display:inline-flex;align-items:center;gap:6px}
.opsboard .live i{width:7px;height:7px;border-radius:50%;background:#3DDC97;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.ob-body{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-top:10px}
@media (max-width:560px){.ob-body{grid-template-columns:1fr}}
.feed{display:flex;flex-direction:column;gap:6px;font-size:.74rem;max-height:420px;overflow:hidden;mask-image:linear-gradient(#000 75%,transparent)}
.feed .ev{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:8px 9px;animation:evin .5s ease}
.feed .ev b{display:block;color:#fff;font-weight:600;font-size:.78rem}
.feed .ev .mono{color:#8FA3B8;font-size:.66rem}
.feed .ev .tag{display:inline-block;font-family:var(--f-mono);font-size:.6rem;padding:1px 5px;border-radius:3px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
@keyframes evin{from{opacity:0;transform:translateY(-8px)}}
.ob-foot{margin-top:10px;font-size:.66rem;color:#7F93A9;font-family:var(--f-mono)}

/* map */
.gamap{width:100%;height:auto;display:block;touch-action:manipulation}
.gamap .cty{stroke:#0B1B2E;stroke-width:.6;cursor:pointer;transition:fill .2s,opacity .2s}
.gamap.dark .cty{stroke:#0A1728}
.gamap .cty:hover,.gamap .cty.sel{fill:#fff!important}
.gamap .cty.dim{opacity:.25}
.gamap .outline{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.4;pointer-events:none}
.gamap.light .outline{stroke:var(--navy)}
.gamap .hub{pointer-events:none}
.gamap .hub circle.core{fill:#fff;stroke:var(--navy);stroke-width:2}
.gamap .hub .pulse{fill:none;stroke:#fff;stroke-width:1.5;transform-origin:center;transform-box:fill-box;animation:pulse 2.6s infinite ease-out}
.gamap.light .hub .pulse{stroke:var(--accent)}
.gamap .hub text{font-family:var(--f-mono);font-size:10px;fill:#fff;paint-order:stroke;stroke:#0B1B2E;stroke-width:3px;pointer-events:none}
.gamap.light .hub text{fill:var(--navy);stroke:#fff}
.gamap .ping{fill:#FFB27F;pointer-events:none}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.maptip{position:absolute;pointer-events:none;background:var(--navy-950);color:#fff;padding:6px 9px;border-radius:5px;font-size:.76rem;white-space:nowrap;transform:translate(-50%,-120%);z-index:5;box-shadow:var(--shadow-2);opacity:0;transition:opacity .12s}
.maptip.on{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.coverage{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:start}
@media (max-width:900px){.coverage{grid-template-columns:1fr}}
.map-card{position:relative;background:var(--navy);border-radius:var(--r-l);padding:18px;color:#fff}
.map-card.light{background:#fff;border:1px solid var(--line);color:var(--charcoal)}
.map-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:6px;padding:3px;gap:2px}
.map-card.light .seg,.seg.light{background:var(--mist)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:4px;font-size:.8rem;cursor:pointer;color:inherit;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.county-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-1)}
.county-panel .cp-empty{color:var(--ink-2);font-size:.95rem}
.county-panel .tierchip{align-self:flex-start}
.county-panel ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.86rem}
.county-panel li{display:flex;gap:6px;align-items:flex-start}
.county-panel li svg{width:15px;height:15px;color:var(--ok);flex:none;margin-top:3px}
.county-panel li.na{color:#9AA6B3;text-decoration:line-through}
.county-panel li.na svg{color:#B5BFCB}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:600}
.searchbox{position:relative}
.searchbox input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;color:var(--charcoal)}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--bluegray)}
.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:0 0 6px 6px;z-index:10;max-height:220px;overflow:auto;box-shadow:var(--shadow-2)}
.sugg button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;font-size:.88rem;color:var(--charcoal)}
.sugg button:hover,.sugg button.hl{background:var(--mist)}

.tierchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:3px;font-weight:500}
.tierchip i{width:8px;height:8px;border-radius:50%}
.tierchip.core{background:#FDE5D6;color:#9A3D08}.tierchip.core i{background:var(--tier-core)}
.tierchip.std{background:#FDF0E1;color:#8A5410}.tierchip.std i{background:var(--tier-std)}
.tierchip.ext{background:#E6ECF3;color:#34495F}.tierchip.ext i{background:var(--tier-ext)}

/* trust bar */
.trust{background:#fff;border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0}
.trust .t{display:flex;gap:11px;align-items:center;padding:20px 14px;border-right:1px solid var(--line);position:relative}
.trust .t:last-child{border-right:0}
.trust .t svg{width:30px;height:30px;flex:none;color:var(--navy)}
.trust .t b{display:block;font-size:.9rem;line-height:1.2}
.trust .t span{display:block;font-size:.74rem;color:var(--ink-2);line-height:1.3;margin-top:2px}
.trust .t .v{position:absolute;top:10px;right:10px;width:14px;height:14px;color:var(--ok)}
@media (max-width:760px){.trust .wrap{grid-template-columns:1fr 1fr}.trust .t{border-bottom:1px solid var(--line)}.trust .t:nth-child(2n){border-right:0}}

/* service cards */
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:1040px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.svc-grid{grid-template-columns:1fr}.svc .img{aspect-ratio:21/9}}
.svc{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s}
.svc:hover{transform:translateY(-4px);box-shadow:var(--shadow-2);border-color:transparent}
.svc .img{aspect-ratio:16/9;overflow:hidden;background:var(--mist);position:relative}
.svc .img svg{width:100%;height:100%;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.svc:hover .img svg{transform:scale(1.06)}
.svc .ic{position:absolute;left:14px;bottom:-18px;width:40px;height:40px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #fff;transition:background .25s}
.svc:hover .ic{background:var(--accent)}
.svc .ic svg{width:21px;height:21px}
.svc .body{padding:30px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.svc .body p{font-size:.9rem;color:var(--ink-2);flex:1}
.svc .more{font-size:.84rem;font-weight:600;color:var(--accent-ink);display:inline-flex;gap:6px;align-items:center}
.svc .more svg{width:14px;height:14px;transition:transform .2s}
.svc:hover .more svg{transform:translateX(4px)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(6,1fr);position:relative;gap:0}
.flow::before{content:"";position:absolute;left:8%;right:8%;top:35px;height:2px;background:rgba(255,255,255,.14)}
.flow .bar{position:absolute;left:8%;top:35px;height:2px;background:var(--accent);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.flow button{background:none;border:0;cursor:pointer;color:#AFC0D2;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 4px 8px;position:relative;z-index:1}
.flow .node{width:70px;height:70px;border-radius:50%;background:var(--navy-800);border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;transition:.3s;color:#DDE6EF}
.flow .node svg{width:28px;height:28px}
.flow button:hover .node{border-color:#FF9A5C;transform:scale(1.05)}
.flow button.on .node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 8px rgba(242,107,33,.18)}
.flow button.done .node{border-color:var(--accent);color:#FFB88E}
.flow .lbl{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em}
.flow button.on .lbl{color:#fff}
.flow .num{font-family:var(--f-mono);font-size:.66rem;color:#7F93A9}
.flow-detail{margin-top:34px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;background:var(--navy-800);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-l);padding:clamp(20px,3vw,34px);min-height:250px}
.flow-detail h3{font-size:1.9rem;color:#fff}
.flow-detail .lede{margin-top:10px;font-size:1.02rem}
.flow-detail ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;font-size:.92rem;color:#D3DDE7}
.flow-detail li{display:flex;gap:10px}
.flow-detail li svg{width:16px;height:16px;color:#FF9A5C;flex:none;margin-top:4px}
.flow-detail .ev-box{background:var(--navy-950);border-radius:var(--r-m);padding:16px;font-family:var(--f-mono);font-size:.76rem;color:#9FB0C3;display:flex;flex-direction:column;gap:8px;border:1px solid rgba(255,255,255,.06)}
.flow-detail .ev-box b{color:#fff;font-weight:500}
.flow-detail .ev-box .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed rgba(255,255,255,.1);padding-bottom:6px}
.flow-progress{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:18px}
.flow-progress i{display:block;height:100%;width:0;background:#FF9A5C}
@media (max-width:860px){
  .flow{grid-template-columns:repeat(3,1fr);row-gap:22px}
  .flow::before,.flow .bar{display:none}
  .flow-detail{grid-template-columns:1fr}
}
@media (max-width:420px){.flow .node{width:58px;height:58px}.flow .lbl{font-size:.9rem}}

/* tech / work order */
.tech{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(24px,4vw,56px);align-items:center}
@media (max-width:960px){.tech{grid-template-columns:1fr}}
.feat-list{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin-top:26px}
@media (max-width:520px){.feat-list{grid-template-columns:1fr}}
.feat{display:flex;gap:12px}
.feat .fi{width:36px;height:36px;border-radius:7px;background:var(--mist);color:var(--navy);display:grid;place-items:center;flex:none}
.feat .fi svg{width:19px;height:19px}
.feat b{display:block;font-size:.95rem}
.feat span{font-size:.84rem;color:var(--ink-2);line-height:1.45;display:block}
.wo{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-2);overflow:hidden;font-size:.86rem}
.wo-top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.wo-top .mono{color:#9FB0C3}
.wo-top b{font-size:1rem}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:3px;font-weight:500}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.status.ok{background:var(--ok-soft);color:#11704A}
.status.prog{background:#DDE9FA;color:#1F58A8}
.status.warn{background:var(--warn-soft);color:#8A5F00}
.status.new{background:var(--accent-soft);color:#9A3D08}
.status.closed{background:var(--mist-2);color:var(--slate)}
.wo-meta{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.wo-meta div{padding:10px 14px;border-right:1px solid var(--line)}
.wo-meta div:last-child{border-right:0}
.wo-meta small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--bluegray);font-family:var(--f-mono)}
.wo-meta b{font-size:.84rem}
@media (max-width:560px){.wo-meta{grid-template-columns:1fr 1fr}.wo-meta div:nth-child(2){border-right:0}.wo-meta div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.wo-tabs{display:flex;border-bottom:1px solid var(--line);padding-inline:10px;gap:2px;overflow-x:auto}
.wo-tabs button{border:0;background:none;padding:11px 12px;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.wo-tabs button.on{color:var(--navy);border-color:var(--accent)}
.wo-pane{padding:16px 18px;min-height:250px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;border-radius:5px;overflow:hidden;aspect-ratio:4/3;background:var(--mist);cursor:zoom-in;border:0;padding:0}
.ph svg{width:100%;height:100%;display:block}
.ph .stamp{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-family:var(--f-mono);font-size:.56rem;padding:12px 6px 4px;text-align:left;line-height:1.3}
.ph .gps{position:absolute;top:5px;right:5px;background:rgba(35,162,109,.95);color:#fff;font-family:var(--f-mono);font-size:.55rem;padding:2px 4px;border-radius:2px;display:flex;gap:3px;align-items:center}
.ph .gps svg{width:9px;height:9px}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.checklist li{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);gap:10px}
.checklist li span{display:flex;gap:9px;align-items:center}
.checklist .ck{width:18px;height:18px;border-radius:4px;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.checklist .ck svg{width:12px;height:12px}
.checklist .ck.off{background:var(--mist-2)}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 14px 28px;transition:opacity .3s}
.tl li::before{content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--bluegray)}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.cur::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px rgba(242,107,33,.2)}
.tl li.todo{opacity:.45}
.tl b{display:block;font-size:.88rem}
.tl .mono{color:var(--ink-2);font-size:.72rem}
.wo-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.qc{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:#11704A}
.qc svg{width:18px;height:18px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid rgba(255,255,255,.12)}
.stat{padding:28px 20px 6px 0;border-right:1px solid rgba(255,255,255,.12);padding-left:20px}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:0}
.stat .n{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:clamp(2.6rem,5vw,4rem);line-height:1;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .n sup{font-size:.45em;color:#FF8A45;vertical-align:top;margin-left:2px;position:relative;top:.3em}
.stat .l{font-size:.86rem;color:#AFBFD0;margin-top:10px;display:block}
.stat .s{font-family:var(--f-mono);font-size:.68rem;color:#6F86A0;margin-top:4px;display:block}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}.stat{border-bottom:1px solid rgba(255,255,255,.12);padding-left:16px!important;padding-bottom:22px}.stat:nth-child(2n){border-right:0}}
.stats.light{border-color:var(--line)}
.stats.light .stat{border-color:var(--line)}
.stats.light .n{color:var(--navy)}
.stats.light .l{color:var(--ink-2)}
.stats.light .s{color:var(--bluegray)}

/* compliance */
.creds{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
@media (max-width:960px){.creds{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.creds{grid-template-columns:1fr}}
.cred{background:#fff;padding:22px;display:flex;flex-direction:column;gap:10px;transition:background .2s}
.cred:hover{background:var(--paper)}
.cred .top{display:flex;justify-content:space-between;align-items:center}
.cred .top svg{width:28px;height:28px;color:var(--navy)}
.cred p{font-size:.86rem;color:var(--ink-2)}
.verified{display:inline-flex;gap:5px;align-items:center;font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:#11704A;background:var(--ok-soft);padding:3px 6px;border-radius:3px}
.verified svg{width:11px!important;height:11px!important;color:#11704A!important}
.verified.pend{color:#8A5F00;background:var(--warn-soft)}
.verified.pend svg{color:#8A5F00!important}

/* before/after */
.ba{position:relative;overflow:hidden;border-radius:var(--r-m);user-select:none;touch-action:pan-y;aspect-ratio:10/7;background:#ccd;cursor:ew-resize}
.ba > svg,.ba .after svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ba .after{position:absolute;inset:0;clip-path:inset(0 0 0 var(--pos,50%))}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:#fff;transform:translateX(-1px);pointer-events:none;box-shadow:0 0 12px rgba(0,0,0,.4)}
.ba .knob{position:absolute;top:50%;left:50%;width:46px;height:46px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);color:var(--navy)}
.ba .knob svg{width:22px;height:22px}
.ba .tag{position:absolute;top:12px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(6,14,26,.8);color:#fff;padding:4px 8px;border-radius:3px;pointer-events:none}
.ba .tag.b{left:12px}.ba .tag.a{right:12px;background:var(--accent)}
.ba input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba .stampbar{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-family:var(--f-mono);font-size:.64rem;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.work-feature{display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:center}
@media (max-width:900px){.work-feature{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:40px;font-size:.84rem;cursor:pointer;font-weight:500;transition:.15s;color:var(--charcoal)}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .c{font-family:var(--f-mono);font-size:.7rem;opacity:.6;margin-left:4px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:960px){.gallery{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.gallery{grid-template-columns:1fr}}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.gcard .pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);position:relative}
.gcard .pair div{aspect-ratio:4/3;overflow:hidden;position:relative}
.gcard .pair svg{width:100%;height:100%;display:block}
.gcard .pair span{position:absolute;left:6px;top:6px;font-family:var(--f-mono);font-size:.58rem;background:rgba(6,14,26,.75);color:#fff;padding:2px 5px;border-radius:2px;text-transform:uppercase;letter-spacing:.08em}
.gcard .pair div:last-child span{background:var(--accent)}
.gcard .gb{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.gcard .gb .mono{color:var(--ink-2);font-size:.72rem}
.gcard .zoom{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--navy);opacity:0;transition:.2s}
.gcard:hover .zoom{opacity:1}
.gcard .zoom svg{width:15px;height:15px}

/* lightbox & modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.modal.open{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(4,10,20,.82);animation:fade .2s}
.modal .box{position:relative;background:#fff;border-radius:var(--r-l);max-width:1080px;width:100%;max-height:100%;overflow:auto;animation:pop .25s cubic-bezier(.2,.7,.2,1)}
.modal .box.sm{max-width:560px}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal .x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);cursor:pointer;z-index:3;display:grid;place-items:center;box-shadow:var(--shadow-1)}
.modal .x svg{width:18px;height:18px}
.lb{display:grid;grid-template-columns:1.5fr 1fr}
.lb .ba{border-radius:0;aspect-ratio:auto;min-height:420px;height:100%}
.lb .info{padding:28px;display:flex;flex-direction:column;gap:14px}
.lb .nav{display:flex;gap:8px;margin-top:auto}
.lb .nav button{flex:1}
@media (max-width:820px){.lb{grid-template-columns:1fr}.lb .ba{min-height:0;aspect-ratio:10/7}}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:7px;font-size:.9rem}
.ticks li{display:flex;gap:9px}
.ticks svg{width:16px;height:16px;flex:none;color:var(--ok);margin-top:4px}

/* why */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.why > div{padding:30px 26px 30px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.why > div:not(:nth-child(3n+1)){padding-left:26px;border-left:1px solid var(--line)}
.why .wi{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center;color:var(--navy);transition:.25s}
.why > div:hover .wi{background:var(--accent);border-color:var(--accent);color:#fff;transform:rotate(-8deg)}
.why .wi svg{width:22px;height:22px}
.why p{font-size:.9rem;color:var(--ink-2);margin-top:6px}
@media (max-width:900px){.why{grid-template-columns:1fr 1fr}.why > div{padding:24px 16px!important;border-left:0!important}.why > div:nth-child(2n){border-left:1px solid var(--line)!important}}
@media (max-width:560px){.why{grid-template-columns:1fr}.why > div:nth-child(2n){border-left:0!important}}

/* contractor band */
.band{position:relative;overflow:hidden;background:var(--charcoal);color:#fff;border-radius:var(--r-l);display:grid;grid-template-columns:1.1fr .9fr}
.band .l{padding:clamp(28px,4vw,52px);display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.band .r{position:relative;min-height:300px;background:#2A3038}
.band .r svg{position:absolute;inset:0;width:100%;height:100%}
.band ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:.9rem;color:#C9D3DD}
.band li{display:flex;gap:8px}.band li svg{width:16px;height:16px;color:#FF9A5C;flex:none;margin-top:4px}
@media (max-width:860px){.band{grid-template-columns:1fr}.band .r{min-height:220px}}
@media (max-width:480px){.band ul{grid-template-columns:1fr}}

/* final CTA */
.final{background:linear-gradient(120deg,var(--navy) 0%,#13305A 100%);color:#fff;position:relative;overflow:hidden}
.final::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border:60px solid rgba(242,107,33,.12);border-radius:50%}
.final .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;position:relative;z-index:1}
.final .ctas{display:flex;gap:12px;flex-wrap:wrap}
.final .contact-mini{display:grid;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-m);padding:20px}
.final .contact-mini a{color:#fff;text-decoration:none;display:flex;gap:12px;align-items:center;font-weight:600}
.final .contact-mini a small{display:block;font-weight:400;color:#9FB0C3;font-size:.76rem}
.final .contact-mini svg{width:20px;height:20px;color:#FF9A5C}
@media (max-width:860px){.final .wrap{grid-template-columns:1fr}}

/* footer */
footer.site{background:var(--navy-950);color:#9FB0C3;font-size:.88rem;padding-block:56px calc(28px + env(safe-area-inset-bottom,0px))}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
footer.site h4{color:#fff;font-size:.8rem;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
footer.site a{color:#C3CFDB;text-decoration:none;display:block;padding:3px 0}
footer.site a:hover{color:#fff}
footer.site .brand{color:#fff}
footer.site .brand small{color:#7F93A9}
footer.site .legal{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.78rem}
footer.site .legal a{display:inline;margin-left:14px}
footer.site .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
footer.site .badges span{font-family:var(--f-mono);font-size:.64rem;border:1px solid rgba(255,255,255,.15);padding:4px 7px;border-radius:3px;color:#C3CFDB;letter-spacing:.05em}
@media (max-width:860px){footer.site .cols{grid-template-columns:1fr 1fr}}
@media (max-width:480px){footer.site .cols{grid-template-columns:1fr}}

/* sticky cta */
.sticky-cta{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;transform:translateY(120px);opacity:0;transition:.35s cubic-bezier(.2,.7,.2,1);box-shadow:0 12px 30px -8px rgba(6,14,26,.45)}
.sticky-cta.on{transform:none;opacity:1}
.mbar{display:none}
@media (max-width:720px){
  .sticky-cta{display:none}
  .mbar{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:.3s}
  .mbar.on{transform:none}
  .mbar .btn{width:100%}
  body{padding-bottom:0}
  footer.site{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}

/* page hero (inner) */
.phero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.phero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,transparent 30%,#000);pointer-events:none}
.phero .wrap{position:relative;padding-block:clamp(40px,6vw,76px);display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center}
.phero.solo .wrap{grid-template-columns:1fr}

function initMap(root,{light=false,onSelect,hero=false,editable=false,onEdit}={}){
  const host=$('.map-host',root), tip=$('.maptip',root);
  let view='ga', sel=null, filter=null;
  const extFill=light?'#C3CFDC':'#2A4668', stdFill=light?'#F4A259':'#E08B45';
  const fillOf=n=>{const t=tierOf(n);return t==='core'?'#F26B21':t==='std'?stdFill:extFill;};
  function drawGA(){
    const hubs=HUBS.map(h=>{const c=cByName[h.c];return `<g class="hub"><circle class="pulse" cx="${c.x}" cy="${c.y}" r="9"/><circle class="core" cx="${c.x}" cy="${c.y}" r="4.5"/>${hero&&h.n!=='Atlanta HQ'?'':`<text x="${c.x+8}" y="${c.y-7}">${h.n}</text>`}</g>`;}).join('');
    host.innerHTML=`<svg class="gamap ${light?'light':'dark'}" viewBox="0 0 ${GA.w} ${GA.h}" role="img" aria-label="Map of Georgia service coverage by county">${COUNTIES.map(c=>`<path class="cty" tabindex="${hero?-1:0}" data-n="${esc(c.n)}" d="${c.d}" fill="${fillOf(c.n)}"><title>${esc(c.n)} County</title></path>`).join('')}<path class="outline" d="${GA.outline}"/><g class="pings"></g>${hubs}</svg>`;
    $$('.cty',host).forEach(p=>{
      p.addEventListener('mousemove',e=>{const r=root.getBoundingClientRect();tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';const t=tierOf(p.dataset.n);tip.innerHTML=`<b>${esc(p.dataset.n)} County</b> · ${TIER_DEF[t].resp}`;tip.classList.add('on');});
      p.addEventListener('mouseleave',()=>tip.classList.remove('on'));
      const act=()=>{ if(editable){const n=p.dataset.n;const order=['core','std','ext'];const nt=order[(order.indexOf(tierOf(n))+1)%3];onEdit&&onEdit(n,nt);p.setAttribute('fill',fillOf(n));return;} select(p.dataset.n);};
      p.addEventListener('click',act);
      p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    applyFilter();
  }
  function drawSE(){
    const col={active:'#F26B21',planned:light?'#F6C9A4':'#6E5A4D',none:light?'#DDE4EC':'#1C3350'};
    host.innerHTML=`<svg class="gamap ${light?'light':'dark'}" viewBox="0 0 ${SE.w} ${SE.h}" role="img" aria-label="Southeast region coverage map">${SE.states.map(s=>{const st=SE_STATUS[s.id]||{s:'none',t:''};return `<path class="cty" data-id="${s.id}" d="${s.d}" fill="${col[st.s]}" style="stroke-width:1.2" tabindex="0"><title>${s.n}: ${st.t}</title></path>`;}).join('')}${SE.states.map(s=>`<text x="${s.x}" y="${s.y}" text-anchor="middle" style="font-family:var(--f-mono);font-size:12px;fill:${light?'#0B1B2E':'#fff'};pointer-events:none;paint-order:stroke;stroke:${light?'#fff':'#0B1B2E'};stroke-width:3px">${s.n}</text>`).join('')}</svg>`;
    $$('.cty',host).forEach(p=>{
      const s=SE.states.find(x=>x.id===p.dataset.id), st=SE_STATUS[s.id];
      p.addEventListener('mousemove',e=>{const r=root.getBoundingClientRect();tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.innerHTML=`<b>${s.n}</b> · ${st.t}`;tip.classList.add('on');});
      p.addEventListener('mouseleave',()=>tip.classList.remove('on'));
      p.addEventListener('click',()=>{ if(s.id==='13'){setView('ga');} else onSelect&&onSelect({state:s,status:st}); });
    });
  }
  function applyFilter(){$$('.cty',host).forEach(p=>{if(!p.dataset.n)return;p.classList.toggle('dim',!!filter&&tierOf(p.dataset.n)!==filter);p.classList.toggle('sel',p.dataset.n===sel);});
    $$('[data-tier]',root).forEach(b=>b.style.opacity=filter&&b.dataset.tier!==filter?.45:1);}
  function select(n){ if(view!=='ga') setView('ga'); sel=n; applyFilter(); onSelect&&onSelect({county:cByName[n]}); if(hero) location.hash='#/service-areas/'+slugC(n); }
  function setView(v){view=v;$$('[data-view]',root).forEach(b=>b.classList.toggle('on',b.dataset.view===v));v==='ga'?drawGA():drawSE();const lg=$('[data-legend]',root);if(lg)lg.style.visibility=v==='ga'?'visible':'hidden';}
  $$('[data-view]',root).forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $$('[data-tier]',root).forEach(b=>b.onclick=()=>{filter=filter===b.dataset.tier?null:b.dataset.tier;applyFilter();});
  const q=$('input[type=text]',root);
  if(q){const sg=$('.sugg',root);let hl=0,list=[];
    const show=()=>{const v=q.value.trim().toLowerCase();if(!v){sg.hidden=true;return;}list=COUNTIES.filter(c=>c.n.toLowerCase().startsWith(v)).concat(COUNTIES.filter(c=>!c.n.toLowerCase().startsWith(v)&&c.n.toLowerCase().includes(v))).slice(0,8);hl=0;sg.innerHTML=list.length?list.map((c,i)=>`<button type="button" class="${i===0?'hl':''}" data-n="${esc(c.n)}">${esc(c.n)} County ${tierChip(tierOf(c.n))}</button>`).join(''):`<div style="padding:10px 12px;font-size:.85rem;color:var(--ink-2)">No Georgia county matches “${esc(q.value)}”.</div>`;sg.hidden=false;$$('button',sg).forEach(b=>b.onmousedown=e=>{e.preventDefault();pick(b.dataset.n);});};
    const pick=n=>{q.value=n+' County';sg.hidden=true;select(n);track('map_search',{county:n});};
    q.addEventListener('input',show);q.addEventListener('focus',show);q.addEventListener('blur',()=>setTimeout(()=>sg.hidden=true,120));
    q.addEventListener('keydown',e=>{if(sg.hidden)return;const bs=$$('button',sg);if(e.key==='ArrowDown'){hl=Math.min(hl+1,bs.length-1);}else if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);}else if(e.key==='Enter'){e.preventDefault();if(list[hl])pick(list[hl].n);return;}else return;e.preventDefault();bs.forEach((b,i)=>b.classList.toggle('hl',i===hl));});
  }
  drawGA();
  return {select,setView,redraw:()=>view==='ga'?drawGA():drawSE(),ping(n){if(view!=='ga')return;const c=cByName[n];if(!c)return;const g=$('.pings',host);if(!g)return;const el=document.createElementNS('http://www.w3.org/2000/svg','circle');el.setAttribute('cx',c.x);el.setAttribute('cy',c.y);el.setAttribute('r','3');el.setAttribute('class','ping');el.style.transformOrigin=`${c.x}px ${c.y}px`;el.animate([{transform:'scale(1)',opacity:1},{transform:'scale(5)',opacity:0}],{duration:1800,easing:'ease-out'}).onfinish=()=>el.remove();g.appendChild(el);}};
}

function mountWorkflow(root){
  if(!root) return; let cur=0,timer=null,auto=true,t0=0; const det=$('.flow-detail',root),bar=$('.flow .bar',root),prog=$('.flow-progress i',root);
  const show=i=>{cur=i;const s=FLOW[i];$$('.flow button',root).forEach((b,j)=>{b.classList.toggle('on',j===i);b.classList.toggle('done',j<i);b.setAttribute('aria-selected',j===i);});bar.style.width=(84*i/5)+'%';

}

function stampFor(p){const c=COUNTIES.find(x=>p.loc.includes(x.n+' Co.'));const ll=c?`${c.lat.toFixed(4)}°N ${Math.abs(c.lon).toFixed(4)}°W`:'';return `<span>${p.wo} · ${p.date}</span><span>${ll}</span>`;}
function baSlider(p,{pos=50,big=false}={}){
  const o=p.int?{int:p.int}:{v:p.v};
  return `<div class="ba" style="--pos:${pos}%">${PHOTO(p.img+'-before',p.t+' — before')}<div class="after">${PHOTO(p.img+'-after',p.t+' — after')}</div><span class="tag b">Before</span><span class="tag a">After</span><div class="handle"><span class="knob">${icon('sliders')}</span></div><div class="stampbar">${stampFor(p)}</div><input type="range" min="0" max="100" value="${pos}" aria-label="Drag to compare before and after: ${esc(p.t)}"></div>`;
}
function mountBA(root=document){$$('.ba input[type=range]',root).forEach(r=>{if(r._m)return;r._m=1;const ba=r.closest('.ba');r.addEventListener('input',()=>ba.style.setProperty('--pos',r.value+'%'));r.addEventListener('change',()=>track('before_after_drag'));});}
function galleryCard(p,i){const o=p.int?{int:p.int}:{v:p.v};return `<button class="gcard" data-rv data-pi="${i}" aria-label="Open project: ${esc(p.t)}"><div class="pair"><div>${PHOTO(p.img+'-before',p.t+' — before')}<span>Before</span></div><div>${PHOTO(p.img+'-after',p.t+' — after')}<span>After</span></div><i class="zoom">${icon('zoom')}</i></div><div class="gb"><span class="mono">${esc(p.cat).toUpperCase()} · ${p.wo}</span><h4>${esc(p.t)}</h4><span class="muted" style="font-size:.86rem">${icon('pin').replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')} ${esc(p.loc)}</span></div></button>`;}
function openLightbox(list,idx){

    mountBA($('#modal'));$$('[data-lb]',$('#modal')).forEach(b=>b.onclick=()=>{idx=(idx+ +b.dataset.lb+list.length)%list.length;draw();});};

const FEED_T=[['Secured','#F26B21','Initial secure completed'],['Inspection','#3A7BD5','Occupancy inspection submitted'],['QC','#23A26D','Work order QC-approved'],['Dispatch','#D99A0B','Crew dispatched'],['Repair','#8E6BD6','Repair bid approved'],['Maint.','#23A26D','Recurring grass cut logged'],['Hazard','#D23B2B','Pool hazard secured'],['Winterize','#3A7BD5','Winterisation pressure-tested']];
let feedTimer=null;
function startFeed(root,map){
  clearInterval(feedTimer); const feed=$('.feed',root); if(!feed)return; let wo=25230;
  const weighted=[...CORE,...CORE,...STD,...COUNTIES.map(c=>c.n).filter((_,i)=>i%6===0)];
  const push=()=>{if(!document.body.contains(feed)){clearInterval(feedTimer);return;}const t=FEED_T[Math.floor(Math.random()*FEED_T.length)];const cn=weighted[Math.floor(Math.random()*weighted.length)];wo+=Math.ceil(Math.random()*7);const d=new Date();const tm=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/New_York'});
    const el=document.createElement('div');el.className='ev';el.innerHTML=`<span class="tag" style="background:${t[1]}33;color:${t[1]}">${t[0]}</span><b>${t[2]}</b><span class="mono">WO-${wo} · ${cn} Co. · ${tm} ET</span>`;feed.prepend(el);if(feed.children.length>7)feed.lastElementChild.remove();map&&map.ping(cn);};

}

/* ============ FORMS ENGINE ============ */
const COMPANY_TYPES=['Asset Management Company','Bank','Mortgage Servicer','REO Asset Manager','Insurance Company','Real Estate Investor','Foreclosure Professional / Law Firm','Property Management Company','Government / Municipal Organization','Institutional Real Estate Group','Other'];
const TRADES=['Preservation (general)','Grass cuts & landscaping','Lock changes & rekeys','Board-up & glazing','Winterisation','Debris removal & trash-outs','Property inspections','Roofing','Plumbing','Electrical','HVAC','Painting & drywall','Flooring','Mould remediation','Pool service','Tree service','Cleaning'];
const FORMS={};
function fld(o,pre={}){
  const id=`f-${o.form}-${o.n}`, v=pre[o.n]??o.v??'', req=o.req?'<span class="req">*</span>':'';
  const lab=`<label for="${id}">${o.l} ${req}</label>`, hint=o.hint?`<span class="hint">${o.hint}</span>`:'', em=`<span class="emsg">${o.em||'This field is required.'}</span>`;
  const cls=`field ${o.full?'full':''}`, cond=o.show?` data-show="${o.show}"`:'';
  switch(o.t){
    case 'select':return `<div class="${cls}"${cond}>${lab}<select id="${id}" name="${o.n}"><option value="">Select…</option>${o.opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>${hint}${em}</div>`;
    case 'textarea':return `<div class="${cls}"${cond}>${lab}<textarea id="${id}" name="${o.n}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>${hint}${em}</div>`;
    case 'chips':{const vals=Array.isArray(v)?v:String(v).split('|').filter(Boolean);return `<div class="${cls}"${cond}><span class="lbl" id="${id}">${o.l} ${req}</span><div class="chipset" role="group" aria-labelledby="${id}">${o.opts.map((x,i)=>{const val=typeof x==='string'?x:x[0],lb=typeof x==='string'?x:x[1];return `<label><input type="${o.radio?'radio':'checkbox'}" id="${id}-${i}" name="${o.n}" value="${esc(val)}" ${vals.includes(val)?'checked':''}><span>${esc(lb)}</span></label>`;}).join('')}</div>${hint}${em}</div>`;}
    case 'files':return `<div class="${cls}"${cond}><span class="lbl">${o.l} ${req}</span><div class="drop" tabindex="0" role="button" data-files="${o.n}" aria-label="${o.l}: choose files">${icon('upload')}<b>Drag &amp; drop or click to upload</b><span>${o.hint||'PDF, DOC, XLS, JPG or PNG · up to 25 MB each'}</span><input type="file" id="${id}" ${o.single?'':'multiple'} accept="${o.accept||'.pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.zip'}" hidden></div><ul class="files" data-list="${o.n}"></ul>${em}</div>`;
    case 'counties':return `<div class="${cls}"${cond}><span class="lbl">${o.l} ${req}</span><div class="searchbox" data-cty="${o.n}">${icon('search')}<input type="text" id="${id}" placeholder="Type a Georgia county…" autocomplete="off"><div class="sugg" hidden></div></div><div class="row-wrap" style="gap:6px;margin-top:4px"><button type="button" class="link" style="font-size:.8rem" data-add="core">+ All Core metro</button><button type="button" class="link" style="font-size:.8rem" data-add="std">+ All Standard</button><button type="button" class="link" style="font-size:.8rem" data-add="clear">Clear</button></div><div class="chipset" data-sel="${o.n}"></div>${hint}${em}</div>`;
    case 'toggle':return `<div class="${cls}"${cond}><label class="toggle"><input type="checkbox" id="${id}" name="${o.n}" ${v?'checked':''}>${o.l}</label>${hint}</div>`;
    case 'consent':return `<div class="${cls}"${cond}><label style="display:flex;gap:10px;align-items:flex-start;font-size:.88rem;cursor:pointer"><input type="checkbox" id="${id}" name="${o.n}" style="margin-top:4px;width:17px;height:17px;accent-color:var(--accent)"><span>${o.l} ${req}</span></label>${em}</div>`;
    default:return `<div class="${cls}"${cond}>${lab}<input type="${o.t||'text'}" id="${id}" name="${o.n}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.min!=null?`min="${o.min}"`:''} ${o.t==='tel'?'inputmode="tel" autocomplete="tel"':''} ${o.t==='email'?'autocomplete="email"':''}>${hint}${em}</div>`;
  }
}
function formHTML(cfg,pre={}){
  const multi=cfg.steps.length>1;
  const a=2+Math.floor(Math.random()*7),b=1+Math.floor(Math.random()*8);cfg._h=a+b;
  const steps=cfg.steps.map((s,i)=>`<div class="fstep" data-step="${i}" ${i?'hidden':''}>${s.intro?`<p class="muted" style="margin-bottom:18px">${s.intro}</p>`:''}<div class="fgrid">${s.fields.map(f=>fld({...f,form:cfg.id},pre)).join('')}</div>${s.review?`<div class="review-host" style="margin-top:4px"></div>`:''}${i===cfg.steps.length-1?`<div class="fgrid" style="margin-top:18px"><div class="field full"><span class="lbl">Quick human check <span class="req">*</span></span><div class="human"><span class="mono">What is ${a} + ${b}?</span><input type="number" name="__h" id="f-${cfg.id}-h" aria-label="Answer to ${a} plus ${b}" inputmode="numeric"></div><span class="emsg">Enter the correct answer to continue.</span></div></div>`:''}</div>`).join('');
  return `<div class="form-shell" id="fs-${cfg.id}">${multi?`<div class="form-steps">${cfg.steps.map((s,i)=>`<button type="button" data-go="${i}" class="${i?'':'on'}"><span class="n">${i+1}</span><span class="t">${s.t}</span></button>`).join('')}</div>`:''}
  <form class="form-body" novalidate id="form-${cfg.id}"><div class="hp" aria-hidden="true"><label>Website<input type="text" name="__web" tabindex="-1" autocomplete="off"></label></div>${steps}
  <div class="form-nav"><button type="button" class="btn ghost sm" data-prev hidden>${icon('left')} Back</button><span class="sp"></span><span class="mono muted" style="font-size:.72rem">${icon('lock').replace('<svg','<svg style="width:13px;vertical-align:-2px"')} Encrypted in transit</span><button type="button" class="btn" data-next>${multi?'Continue':cfg.submit(pre)} ${icon('arrow','arr')}</button></div></form></div>`;
}
function mountForm(cfg,pre={}){
  const shell=$('#fs-'+cfg.id); if(!shell) return; const form=$('form',shell); const st={step:0,files:{},cty:{}};
  const N=cfg.steps.length;
  const allFields=()=>cfg.steps.flatMap(s=>s.fields);
  const val=n=>{const els=$$(`[name="${n}"]`,form);if(!els.length)return '';const e=els[0];if(e.type==='checkbox'&&els.length===1&&!e.value.includes(' ')&&(e.value==='on'))return e.checked;if(e.type==='checkbox'||e.type==='radio'){const c=els.filter(x=>x.checked).map(x=>x.value);return e.type==='radio'?(c[0]||''):c;}return e.value.trim();};
  const fieldEl=n=>$(`#f-${cfg.id}-${n}`,form)?.closest('.field')||$(`[data-files="${n}"]`,form)?.closest('.field')||$(`[data-cty="${n}"]`,form)?.closest('.field');
  // conditional
  const cond=()=>$$('[data-show]',form).forEach(el=>{const [k,v]=el.dataset.show.split('=');const cur=val(k);el.hidden=!(v==='1'?cur===true:String(cur)===v);});
  form.addEventListener('change',cond);cond();
  // files
  $$('[data-files]',form).forEach(dz=>{const n=dz.dataset.files,inp=$('input',dz),list=$(`[data-list="${n}"]`,form);st.files[n]=[];const f=allFields().find(x=>x.n===n);
    const draw=()=>{list.innerHTML=st.files[n].map((x,i)=>`<li><span>${icon('file')}<b>${esc(x.name)}</b><span class="mono muted">${(x.size/1024).toFixed(0)} KB</span></span><button type="button" aria-label="Remove ${esc(x.name)}" data-rm="${i}">×</button></li>`).join('');$$('[data-rm]',list).forEach(b=>b.onclick=()=>{st.files[n].splice(+b.dataset.rm,1);draw();});};
    const add=fs=>{for(const x of fs){if(x.size>25*1024*1024){toast(`${x.name} is over 25 MB — please compress it or send it by email.`);continue;}if(f.single)st.files[n]=[];st.files[n].push(x);}draw();dz.closest('.field').classList.remove('err');};
    dz.onclick=()=>inp.click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click();}};inp.onchange=()=>{add(inp.files);inp.value='';};
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');add(e.dataTransfer.files);};});
  // counties
  $$('[data-cty]',form).forEach(box=>{const n=box.dataset.cty,inp=$('input',box),sg=$('.sugg',box),selEl=$(`[data-sel="${n}"]`,form);st.cty[n]=new Set(pre[n]?String(pre[n]).split('|'):[]);
    const draw=()=>{selEl.innerHTML=[...st.cty[n]].sort().map(c=>`<label><input type="checkbox" checked data-c="${esc(c)}"><span>${esc(c)}</span></label>`).join('')||`<span class="hint">No counties selected yet.</span>`;$$('input',selEl).forEach(i=>i.onchange=()=>{st.cty[n].delete(i.dataset.c);draw();});};
    const show=()=>{const q=inp.value.trim().toLowerCase();if(!q){sg.hidden=true;return;}const l=COUNTIES.filter(c=>c.n.toLowerCase().includes(q)).slice(0,8);sg.innerHTML=l.map(c=>`<button type="button" data-n="${esc(c.n)}">${esc(c.n)} County ${tierChip(tierOf(c.n))}</button>`).join('')||'<div style="padding:10px;font-size:.85rem">No match</div>';sg.hidden=false;$$('button',sg).forEach(b=>b.onmousedown=e=>{e.preventDefault();st.cty[n].add(b.dataset.n);inp.value='';sg.hidden=true;draw();box.closest('.field').classList.remove('err');});};
    inp.oninput=show;inp.onblur=()=>setTimeout(()=>sg.hidden=true,120);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const b=$('button',sg);if(b)b.dispatchEvent(new MouseEvent('mousedown'));}};
    $$('[data-add]',box.parentElement).forEach(b=>b.onclick=()=>{if(b.dataset.add==='clear')st.cty[n].clear();else COUNTIES.filter(c=>tierOf(c.n)===b.dataset.add).forEach(c=>st.cty[n].add(c.n));draw();});draw();});
  // values
  const values=()=>{const o={};allFields().forEach(f=>{if(f.t==='files')o[f.n]=st.files[f.n].map(x=>x.name);else if(f.t==='counties')o[f.n]=[...st.cty[f.n]];else o[f.n]=val(f.n);});return o;};
  const validate=i=>{let ok=true,first=null;cfg.steps[i].fields.forEach(f=>{const el=fieldEl(f.n);if(!el||el.closest('[hidden]'))return;let v=f.t==='files'?st.files[f.n]:f.t==='counties'?[...st.cty[f.n]]:val(f.n);let bad=false;
      if(f.req){if(Array.isArray(v)?!v.length:(v===''||v===false))bad=true;}
      if(!bad&&v&&f.t==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){bad=true;el.querySelector('.emsg').textContent='Enter a valid email address, e.g. name@company.com.';}
      if(!bad&&v&&f.t==='tel'&&String(v).replace(/\D/g,'').length<10){bad=true;el.querySelector('.emsg').textContent='Enter a 10-digit phone number, including area code.';}
      if(!bad&&f.t==='number'&&v!==''&&f.min!=null&&+v<f.min){bad=true;el.querySelector('.emsg').textContent=`Enter ${f.min} or more.`;}
      el.classList.toggle('err',bad);if(bad){ok=false;first=first||el;}});
    if(i===N-1){const h=$(`#f-${cfg.id}-h`,form),hf=h.closest('.field');const bad=+h.value!==cfg._h;hf.classList.toggle('err',bad);if(bad){ok=false;first=first||hf;}}
    if(first){first.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>$('input,select,textarea,.drop',first)?.focus({preventScroll:true}),350);}
    return ok;};
  form.addEventListener('input',e=>e.target.closest('.field')?.classList.remove('err'));
  form.addEventListener('change',e=>e.target.closest('.field')?.classList.remove('err'));
  const go=i=>{st.step=i;$$('.fstep',form).forEach((s,j)=>s.hidden=j!==i);$$('.form-steps button',shell).forEach((b,j)=>{b.classList.toggle('on',j===i);b.classList.toggle('done',j<i);});
    $('[data-prev]',form).hidden=i===0;const nx=$('[data-next]',form);nx.innerHTML=(i===N-1?cfg.submit(values()):'Continue')+' '+icon('arrow','arr');
    const rh=$('.fstep[data-step="'+i+'"] .review-host',form);if(rh)rh.innerHTML=reviewHTML(cfg,values());
    if(N>1)shell.scrollIntoView({behavior:'smooth',block:'start'});};
  $$('.form-steps button',shell).forEach(b=>b.onclick=()=>{const t=+b.dataset.go;if(t<=st.step)go(t);else{for(let k=st.step;k<t;k++){if(!validate(k)){go(k);return;}}go(t);}});
  $('[data-prev]',form).onclick=()=>go(st.step-1);
  form.addEventListener('change',()=>{if(st.step===N-1){$('[data-next]',form).innerHTML=cfg.submit(values())+' '+icon('arrow','arr');}});
  $('[data-next]',form).onclick=async()=>{
    if(!validate(st.step))return; if(st.step<N-1){track('form_step',{form:cfg.id,step:st.step+1});go(st.step+1);return;}
    if($('[name="__web"]',form).value){return;} // honeypot
    const btn=$('[data-next]',form);btn.disabled=true;btn.textContent='Submitting…';
    const v=values(); const type=cfg.type(v);
    const rec={ref:mkRef(type),type,createdAt:new Date().toISOString(),status:'new',source:location.hash,data:v,files:Object.entries(st.files).flatMap(([k,a])=>a.map(x=>({field:k,name:x.name,size:x.size,type:x.type})))};
    const r=await saveSubmission(rec);
    track('form_submit',{form:cfg.id,type,ref:rec.ref,stored:r.stored});
    if(r.quota){btn.disabled=false;btn.innerHTML=cfg.submit(v);toast(`We couldn’t record this submission because the inbox is full. Please call ${SITE.phone} or email ${SITE.email}.`,6000);return;}
    shell.innerHTML=cfg.success(rec,r);shell.scrollIntoView({behavior:'smooth',block:'start'});
  };
}
function reviewHTML(cfg,v){const rows=cfg.steps.flatMap(s=>s.fields).filter(f=>f.t!=='consent').map(f=>{let x=v[f.n];if(Array.isArray(x)){const m=f.opts?Object.fromEntries(f.opts.map(o=>typeof o==='string'?[o,o]:o)):{};x=x.map(i=>m[i]||i).join(', ');}if(x===true)x='Yes';if(x===false)x='No';return x?`<div><dt>${f.l}</dt><dd>${esc(x)}</dd></div>`:'';}).join('');return `<span class="lbl" style="font-weight:600;font-size:.84rem;display:block;margin-bottom:8px">Review your submission</span><dl class="review">${rows}</dl>`;}
function mkRef(type){const d=new Date();const p={'rfp':'RFP','service-request':'SR','contractor-application':'CA','contact':'CT','document-request':'DR','portal-access':'PA'}[type]||'WEB';return `${p}-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.floor(1000+Math.random()*9000)}`;}
async function saveSubmission(rec){const db=await dbP;if(!db)return {stored:false};try{await db.collection('submissions').doc(rec.ref).set(rec);return {stored:true};}catch(e){if(e&&e.code==='quota_exceeded')return {stored:false,quota:true};if(e&&e.code==='unavailable'){try{await new Promise(r=>setTimeout(r,600+Math.random()*600));await db.collection('submissions').doc(rec.ref).set(rec);return {stored:true};}catch(_){}}return {stored:false,err:e?.code};}}

/* ============ PDF GENERATION ============ */
function pdfDoc(kind){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('The document generator is still loading — try again in a moment.');return null;}
  const d=new J({unit:'pt',format:'letter'});const W=612,M=54;let y=0;const navy=[11,27,46],acc=[242,107,33],ink=[40,46,54];
  const titles={packet:'Company Credentials Packet',overview:'Company Overview',coverage:'Service Coverage',compliance:'Compliance Documentation'};
  const header=()=>{d.setFillColor(...navy);d.rect(0,0,W,86,'F');d.setFillColor(...acc);d.rect(0,86,W,4,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(18);d.text(SITE.company.toUpperCase(),M,40);d.setFont('helvetica','normal');d.setFontSize(10);d.text(titles[kind]+'  ·  Issued '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),M,60);y=124;};
  const need=h=>{if(y+h>740){d.addPage();header();}};
  const H=t=>{need(40);d.setTextColor(...acc);d.setFont('helvetica','bold');d.setFontSize(9);d.text(t.toUpperCase(),M,y);y+=16;d.setDrawColor(214,222,232);d.line(M,y-8,W-M,y-8);y+=4;};
  const T=(t,sz=10.5,b=false)=>{d.setTextColor(...ink);d.setFont('helvetica',b?'bold':'normal');d.setFontSize(sz);d.splitTextToSize(t,W-2*M).forEach(l=>{need(16);d.text(l,M,y);y+=sz*1.45;});y+=4;};
  const L=items=>items.forEach(i=>{d.setTextColor(...ink);d.setFont('helvetica','normal');d.setFontSize(10);const ls=d.splitTextToSize(i,W-2*M-14);need(ls.length*14);d.setFillColor(...acc);d.circle(M+3,y-3,2,'F');ls.forEach(l=>{d.text(l,M+14,y);y+=14;});y+=2;});
  const KV=rows=>rows.forEach(([a,b])=>{need(16);d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(110,120,132);d.text(a,M,y);d.setTextColor(...ink);d.setFont('helvetica','bold');d.text(String(b),M+170,y);y+=16;});
  header();
  const S=SITE.stats;const over=()=>{H('Company overview');T(`${SITE.company} provides property preservation, inspections, REO, pre-foreclosure, repairs, hazard abatement, occupied-property and vendor-managed repair services to asset managers, mortgage servicers, banks, insurers and investors across all ${S.counties} Georgia counties.`);T('Every work order is documented with GPS-tagged, time-stamped photographs and passes quality-control review before submission.');H('Key figures');KV([['Years of experience',S.years+'+'],['Properties serviced',fmt(S.properties)+'+'],['Work orders completed',fmt(S.workorders)+'+'],['Vetted field contractors',S.contractors+'+'],['Counties covered',S.counties],['Core-metro initial response',S.response+' hours'],['QC first-pass approval',S.compliance+'%']]);y+=6;};
  const svcs=()=>{H('Services');SERVICES.forEach(s=>{need(34);T(s.name,10.5,true);y-=6;T(s.short,9.5);});};
  const cov=full=>{H('Coverage tiers');['core','std','ext'].forEach(t=>{const list=COUNTIES.filter(c=>tierOf(c.n)===t).map(c=>c.n);T(`${TIER_DEF[t].label} — ${TIER_DEF[t].resp} (${list.length} counties)`,10.5,true);y-=4;T(TIER_DEF[t].sla+'.',9.5);if(full){T(list.join(', '),9);}});H('Field hubs');T(HUBS.map(h=>h.n).join(' · '));};
  const comp=()=>{H('Credentials');L(CRED_DEFS.filter(c=>SITE.creds[c.k]).map(c=>`${c.t} — ${c.d}`));H('Compliance procedures');L(['Licensing — state and local trade licences tracked with expiry alerts','Insurance — general liability, workers’ comp, commercial auto and E&O; COI naming the client available on request','Background screening — owner and every field worker, before first assignment and annually','Vendor compliance — continuous COI and licence monitoring; expired documents pause dispatch','Safety — OSHA-aligned jobsite procedures and hazard classification','Quality control — five-step QC review on every work order','Records — GPS/time-stamped photo evidence retained for seven years']);};
  const contact=()=>{H('Contact');KV([['Business development',SITE.phone],['24/7 emergency',SITE.emergency],['Email',SITE.email],['Vendor relations',SITE.vendorEmail],['Office',SITE.address]]);};
  if(kind==='packet'){over();svcs();cov(false);comp();H('Documents available on request');L(['W-9','Certificate of Insurance (naming your organisation)','Trade licences','Certifications']);contact();}
  if(kind==='overview'){over();svcs();contact();}
  if(kind==='coverage'){cov(true);contact();}
  if(kind==='compliance'){comp();contact();}
  const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(140,150,160);d.setFont('helvetica','normal');d.text(`${SITE.company} · ${titles[kind]} · Page ${i} of ${n}`,M,770);}
  return {doc:d,name:`${SITE.short}-${titles[kind].replace(/\s+/g,'-')}.pdf`};
}
async function saveFile(filename,data){const dl=await dlP;if(!dl){toast('Downloads aren’t available in this view.');return false;}try{const r=await dl.save({filename,data});if(r&&r.status)toast(r.status==='delivered'?'Sent to your chosen destination.':'Download started.');track('file_download',{file:filename});return true;}catch(e){if(e&&e.code==='declined')return false;toast(e&&e.code==='rate_limited'?'Too many downloads at once — try again shortly.':'The download couldn’t start in this view.');return false;}}
async function downloadPdf(kind){const r=pdfDoc(kind);if(!r)return;await saveFile(r.name,r.doc.output('arraybuffer'));}

  openModal(`<div style="padding:28px" class="grid-gap"><div><span class="eyebrow">${TYPE_LBL[l.type]||esc(l.type)}</span><h3 style="font-size:1.5rem;margin-top:6px">${esc(d.name||d.contactName||'Submission')} ${d.company||d.companyName?`<span class="muted" style="font-weight:500">· ${esc(d.company||d.companyName)}</span>`:''}</h3><span class="mono muted" style="font-size:.74rem">${esc(l.ref)} · ${new Date(l.createdAt).toLocaleString()} · from ${esc(l.source||'')}</span></div>
  <dl class="review">${rows}</dl>${(l.files||[]).length?`<div><b style="font-size:.86rem">Attachments</b><ul class="files">${l.files.map(f=>`<li><span>${icon('file')}<b>${esc(f.name)}</b><span class="mono muted">${esc(f.field)} · ${(f.size/1024).toFixed(0)} KB</span></span></li>`).join('')}</ul><span class="hint" style="font-size:.76rem;color:var(--ink-2)">In production, attachments are delivered to the secure document store and notification email.</span></div>`:''}
  <div class="fgrid"><div class="field"><label for="ld-st">Status</label><select id="ld-st">${STATUS.map(([k,t])=>`<option value="${k}" ${l.status===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="ld-as">Assigned to</label><input type="text" id="ld-as" value="${esc(l.assignee||'')}" placeholder="Team member"></div><div class="field full"><label for="ld-nt">Internal notes</label><textarea id="ld-nt">${esc(l.notes||'')}</textarea></div></div>
  <div class="row-wrap" style="justify-content:space-between"><div class="row-wrap">${d.email?`<a class="btn sm ghost" href="mailto:${esc(d.email)}?subject=${encodeURIComponent('Re: '+l.ref)}">${icon('mail')} Email</a>`:''}${d.phone?`<a class="btn sm ghost" href="${telHref(d.phone)}">${icon('phone')} Call</a>`:''}</div><button class="btn" id="ld-save">Save</button></div></div>`,'sm');
  $('#ld-save').onclick=async()=>{const db=await dbP;try{await db.doc('submissions/'+l.id).update({status:$('#ld-st').value,assignee:$('#ld-as').value.trim(),notes:$('#ld-nt').value,updatedAt:new Date().toISOString()});toast('Saved.');closeModal();}catch(e){toast(e.code==='invalid_argument'?'You don’t have permission to update leads.':'Couldn’t save — try again.');}};}
function exportCSV(){const cols=['ref','type','status','createdAt','name','company','email','phone','companyType','services','location','properties','territory','isRfp','rfpDue','contactPref','serviceArea','servicesOffered','years','details','message','notes'];
  const cell=v=>{if(Array.isArray(v))v=v.join('; ');v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const out=[cols.join(',')].concat(LEADS.map(l=>{const d={...l.data,ref:l.ref,type:l.type,status:l.status,createdAt:l.createdAt,notes:l.notes,name:l.data?.name||l.data?.contactName,company:l.data?.company||l.data?.companyName};return cols.map(c=>cell(d[c])).join(',');})).join('\n');
  saveFile(`leads-${new Date().toISOString().slice(0,10)}.csv`,out);}
async function saveCMS(key,data){const db=await dbP;if(!db){toast('Data service unavailable.');return;}try{await db.doc('cms/'+key).set(data);toast('Published — changes are live for all visitors.');}catch(e){toast(e.code==='invalid_argument'?'Only editors can publish content changes.':'Couldn’t publish — try again.');}}
function localGet(k){try{return localStorage.getItem('pfs_'+k);}catch(_){return null;}}
function localSet(k,v){try{localStorage.setItem('pfs_'+k,v);}catch(_){}}

/* ============ SEO ============ */
function orgSchema(){return {'@context':'https://schema.org','@type':'LocalBusiness','@id':'#org',name:SITE.company,description:'Property preservation, inspections and field services for institutional real-estate clients across Georgia.',telephone:SITE.phone,email:SITE.email,address:{'@type':'PostalAddress',streetAddress:SITE.address.split(',')[0],addressLocality:'Atlanta',addressRegion:'GA',addressCountry:'US'},areaServed:{'@type':'State',name:'Georgia'},openingHours:'Mo-Fr 07:00-19:00',hasOfferCatalog:{'@type':'OfferCatalog',name:'Field services',itemListElement:SERVICES.map(s=>({'@type':'Offer',itemOffered:{'@type':'Service',name:s.name}}))}};}
function seoRoutes(){const r=[['/',P.home()],['/about',P.about()],['/services',P.services()],...SERVICES.map(s=>['/services/'+s.slug,P.service(s.slug)]),['/service-areas',P.areas()],...COUNTIES.map(c=>['/service-areas/'+c.slug,P.county(c.slug)]),['/technology-compliance',P.tech()],['/our-work',P.work()],['/resources',P.resources()],['/contact',P.contact()],['/request-service',P.request({})],['/join-network',P.join({})]];return r.map(([path,p])=>({path,title:p.title,desc:p.desc}));}
function setMeta(p,path){document.title=p.title;const m=(sel,make)=>{let e=document.head.querySelector(sel);if(!e){e=make();document.head.appendChild(e);}return e;};
  m('meta[name="description"]',()=>Object.assign(document.createElement('meta'),{name:'description'})).setAttribute('content',p.desc||'');
  m('meta[name="robots"]',()=>Object.assign(document.createElement('meta'),{name:'robots'})).setAttribute('content',p.noindex?'noindex,nofollow':'index,follow');
  m('link[rel="canonical"]',()=>Object.assign(document.createElement('link'),{rel:'canonical'})).setAttribute('href',(localGet('seoBase')||'https://www.palisadefield.com')+path);
  m('meta[property="og:title"]',()=>{const e=document.createElement('meta');e.setAttribute('property','og:title');return e;}).setAttribute('content',p.title);
  const ld=m('script#ld',()=>Object.assign(document.createElement('script'),{id:'ld',type:'application/ld+json'}));const g=[orgSchema()];if(p.schema)g.push({'@context':'https://schema.org',...p.schema});ld.textContent=JSON.stringify(g.length>1?g:g[0]);}

/* ============ ROUTER ============ */
function parse(){const h=(location.hash||'#/').slice(1);const [path,qs]=h.split('?');const q=Object.fromEntries(new URLSearchParams(qs||''));return {path:path.replace(/\/+$/,'')||'/',q};}
function resolve({path,q}){const s=path.split('/').filter(Boolean);
  if(!s.length)return P.home();
  switch(s[0]){case 'about':return P.about();case 'services':return s[1]?P.service(s[1]):P.services();case 'service-areas':return s[1]?P.county(s[1]):P.areas();case 'technology-compliance':return P.tech();case 'our-work':return P.work();case 'resources':return P.resources();case 'contact':return P.contact();case 'request-service':return P.request(q);case 'join-network':return P.join(q);case 'client-portal':return P.portal('client');case 'vendor-portal':return P.portal('vendor');case 'admin':return P.admin();}
  return P.notfound();}
let lastPath=null;
function render(opts={}){
  CLEANUP.forEach(f=>{try{f();}catch(_){}});CLEANUP=[];EDIT_COVER=null;PENDING_COVER=null;clearInterval(feedTimer);
  const r=parse();const p=resolve(r);setMeta(p,r.path);
  const same=r.path===lastPath;lastPath=r.path;
  $('#app').innerHTML=`<div class="page">${p.html}</div>`;
  if(!opts.keepScroll&&!same)window.scrollTo(0,0);
  closeDrawer();if(!opts.keepModal)closeModal();
  $$('nav.main [data-nav]').forEach(a=>{const n=a.dataset.nav;a.classList.toggle('active',n==='/'?r.path==='/':r.path.startsWith(n));});
  try{p.mount&&p.mount();}catch(e){console.error(e);}
  setupReveal();
  if(!opts.silent)track('page_view',{path:r.path,title:p.title});
  window.dispatchEvent(new Event('scroll'));
}
window.addEventListener('hashchange',()=>render());

/* ============ REVEAL & COUNTERS ============ */
function setupReveal(){
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;if(!('IntersectionObserver' in window)||rm)return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add('revealed');t.classList.remove('pending');io.unobserve(t);$$('[data-count]',t).forEach(countUp);}),{rootMargin:'0px 0px -6% 0px'});
  const vh=innerHeight;
  $$('[data-rv]').forEach(el=>{if(el.getBoundingClientRect().top>vh){const sib=[...el.parentElement.children].indexOf(el);el.style.transitionDelay=(sib%4)*70+'ms';el.classList.add('pending');$$('[data-count]',el).forEach(c=>c.textContent='0');io.observe(el);}});
  CLEANUP.push(()=>io.disconnect());
}
function countUp(el){const target=parseFloat(el.dataset.count),dec=String(el.dataset.count).includes('.')?1:0,t0=performance.now(),D=1500;const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3),v=target*e;el.textContent=dec?v.toFixed(1):fmt(Math.round(v));if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

/* ============ INIT ============ */
renderChrome();render({silent:false});
// Live CMS content from the site database
dbP.then(db=>{if(!db)return;const FORM_ROUTES=/request-service|join-network|contact|admin/;
  const u1=db.doc('cms/site').onSnapshot(s=>{if(!s.exists)return;const n={...DEFAULT_SITE,...s.data(),stats:{...DEFAULT_SITE.stats,...(s.data().stats||{})},creds:{...DEFAULT_SITE.creds,...(s.data().creds||{})}};if(JSON.stringify(n)===JSON.stringify(SITE))return;SITE=n;renderChrome();if(!FORM_ROUTES.test(location.hash))render({keepScroll:true,silent:true,keepModal:true});else if(/admin/.test(location.hash)&&ADMIN_TAB!=='content')drawAdmin();},()=>{});
  const u2=db.doc('cms/coverage').onSnapshot(s=>{const o=(s.exists&&s.data().overrides)||{};if(JSON.stringify(o)===JSON.stringify(COVER_OVR))return;COVER_OVR=o;PENDING_COVER=null;if(!FORM_ROUTES.test(location.hash))render({keepScroll:true,silent:true,keepModal:true});else if(/admin/.test(location.hash)&&ADMIN_TAB==='coverage')drawAdmin();},()=>{});
});
